project_root: ..
output_root: resultados
frequency: 15min
timezone: America/Lima
seed: 42
horizons: [96, 672, 2688]

inputs:
  historical_dir: datahistorica
  new_customers_dir: nuevosclientes
  external_dir: variables_externas
  # Obligatorio: sin catálogo autorizado no inicia la ingesta (fallo cerrado).
  authorized_catalog: medidoralimentador.xlsx
  # Sin lista de años: los libros demanda<AAAA>.xls[x] se descubren por contenido.

cleaning:
  forward_fill_limit: 4
  weekly_lag: 672
  outlier_window: 672
  outlier_threshold: 6.0

exogenous:
  sources:
    calendario_pe:
      path: variables_externas/calendario/feriados_peru_2023_2036.csv
      frequency: 1d
      value_columns: [feriado, fin_semana, no_laborable]
      availability: known_future
      future_policy: calendar
      source_url: https://www.gob.pe/feriados
      enabled: true
    temperatura_ica:
      path: variables_externas/temperatura/temperatura_horaria_ica_centro_2023_2026.csv
      frequency: 1h
      value_columns: [temperatura_c]
      availability: historical_only
      future_policy: climatology
      source_url: https://open-meteo.com/en/docs/historical-weather-api
      # Snapshot crudo verificado por hash; fuente primaria de la matriz histórica de temperatura.
      raw_snapshot: variables_externas/_raw/open_meteo_archive/2026-10-15/respuesta.raw
      enabled: true
    pbi_bcrp:
      path: variables_externas/economia/pbi_mensual_bcrp_2023_2026.csv
      frequency: 1M
      value_columns: [valor]
      availability: publication_lag
      future_policy: last_known
      # Rezago conservador declarado: el PBI de un periodo se considera publicado periodo + 3 meses.
      # La fecha de descarga NO define disponibilidad.
      publication_lag_months: 3
      source_url: https://estadisticas.bcrp.gob.pe/estadisticas/series/mensuales/resultados/PN01773AM/html
      enabled: true
    poblacion_ica:
      path: variables_externas/poblacion/poblacion_ica_2023_2026.csv
      frequency: 1Y
      value_columns: [poblacion]
      availability: known_future
      future_policy: official_projection
      source_url: https://www.gob.pe/institucion/inei/informes-publicaciones/6894980
      enabled: true
    clientes_confirmados:
      path: nuevosclientes/nuevosclientes.xlsx
      frequency: 1Y
      value_columns: [incremento_kw]
      availability: scenario
      future_policy: scenario_only
      source_url: internal://electro-dunas/clientes-confirmados
      enabled: false
      estado: SCENARIO_ONLY
      motivo: escenario de planeamiento confirmado; no entra a la historia ni al entrenamiento
    produccion_regional:
      path: variables_externas/produccion_regional/produccion_regional.csv
      frequency: 1M
      value_columns: [indice_produccion]
      availability: scenario
      future_policy: scenario_only
      source_url: https://www.gob.pe/institucion/inei/informes-publicaciones/7567597
      enabled: false
      estado: BLOCKED_MISSING_SOURCE
      motivo: sin tabla oficial verificada de produccion regional de Ica; INEI no accesible en la verificacion
    senamhi_ica:
      path: variables_externas/senamhi/senamhi_ica_verificado.csv
      frequency: 1h
      value_columns: [temperatura_c]
      availability: historical_only
      future_policy: climatology
      source_url: https://www.senamhi.gob.pe/main.php?dp=ica&p=estaciones
      enabled: false
      estado: BLOCKED_MISSING_SOURCE
      motivo: la web de datos hidrometeorologicos de Ica requiere descarga interactiva sin API documentada; falta exportacion verificada
    nasa_power:
      path: variables_externas/_raw/nasa_power/2026-10-15/respuesta.raw
      frequency: 1h
      value_columns: [temperatura_c]
      availability: historical_only
      future_policy: climatology
      source_url: https://power.larc.nasa.gov/docs/services/api/temporal/hourly/
      enabled: false
      estado: REJECTED_WITH_EVIDENCE
      motivo: sesgo medio de -2.26 C frente a ERA5 (Open-Meteo) y correlacion 0.71 en 2023-2026; se mantiene solo como fallback de menor prioridad
training:
  prefilter_max_seconds: 300
  seed: 42

evaluation:
  alpha: 0.05
  minimum_improvement: 0.0

prediction:
  planning_end: "2028-01-01 00:00"
